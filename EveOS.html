    <script>
        // Friendly heads-up when EveOS runs straight off the disk: everything browser-side is
        // fully local; the connection errors that follow just mean the OPTIONAL servers are off.
        if (location.protocol === 'file:') {
            console.info(
                '%cEveOS — local file mode',
                'font-weight:bold;color:#7ee2a8;font-size:1.05em;',
                '\nRunning from file:// with no server — browser-side features work fully offline.' +
                '\nAny "ERR_CONNECTION_REFUSED" lines below are just optional servers being off (they are retried gently in the background).' +
                '\nFor the Gemini backend, CABLE bridge, global hotkeys, and path ports: run start-server.bat and open http://127.0.0.1:8765/EveOS.html'
            );
        }
    </script>

<body>

    <!-- SIDEBAR -->
    <div id="sidebar"></div>

    <!-- MAIN CONTENT WRAPPER -->

    <div id="main-content">

        <!-- TOP BAR -->
        <div class="top-bar">
            <div style="display:flex; align-items:center; gap:12px; margin-left:-24px;">
                <button class="topbar-primary-btn" id="sidebar-toggle-btn" onclick="toggleSidebarVisibility()" style="padding:4px 8px; font-size:1rem; cursor:pointer;">&#9776;</button>
                <div class="logo">Eve OS</div>
            </div>
            <div class="top-right">
                <button class="topbar-primary-btn" onclick="toggleBulkMode()" title="Select Multiple (Alt+B)">&#9989; Select</button>
                <button class="topbar-primary-btn" onclick="toggleView()" title="View">&#128203; View</button>
                <button class="topbar-map-btn topbar-constellation-btn" onclick="if(window.EveConstellationMap) window.EveConstellationMap.openCurrentViewMap()" title="Constellation Map">&#127756; Map</button>
                <button class="topbar-map-btn topbar-matrix-btn" type="button"
                    onclick="window.EveMatrixWorkshop?.openCurrentView ? window.EveMatrixWorkshop.openCurrentView() : (window.__eveMatrixOpenPending = true)" aria-haspopup="dialog"
                    aria-controls="matrix-workshop-overlay" aria-expanded="false"
                    title="Matrix Workshop">&#9001; Matrix</button>
                <button class="topbar-map-btn topbar-audioflix-btn" type="button"
                    onclick="window.EveAudioflix?.open ? window.EveAudioflix.open() : (window.__eveAudioflixOpenPending = true)" aria-haspopup="dialog"
                    aria-controls="audioflix-overlay" aria-expanded="false"
                    title="Audioflix">&#127925; Audioflix</button>
                <button class="topbar-primary-btn topbar-notes-world-book-btn" type="button"
                    onclick="window.EveWorldBook?.open ? window.EveWorldBook.open() : (window.__eveWorldBookOpenPending = true)"
                    aria-haspopup="dialog" aria-controls="notes-world-book-overlay" aria-expanded="false"
                    title="Notes &amp; World Books">&#128221; Notes &amp; World Books</button>
                <button class="topbar-primary-btn" onclick="openSettings()" title="Settings">&#9881; Settings</button>
                <button class="topbar-primary-btn" onclick="openSocialManagerModal()" title="Social Manager">&#128241; Social</button>
            </div>
        </div>

        <!-- HEADER -->
        <div class="header">
            <div id="main-display" class="greeting" onclick="toggleHeaderMode()">Good Morning</div>
            <div id="date-area" style="font-size:1.1rem; opacity:0.8; margin-bottom:10px;"></div>

            <!-- MODULE INJECTION POINT -->
            <div class="info-row">
                <div id="weather-span" onclick="fetchWeather()"
                    style="display:none; cursor:pointer; align-items:center; gap:8px;">
                    <span id="weather-icon">☁️</span>
                    <span id="weather-text">Weather</span>
                </div>
                <div id="timer-area">
                    <span id="timer-display" onclick="editTimer()" style="cursor:pointer;"
                        title="Click to Edit Time">25:00</span>
                    <button class="timer-btn" id="timer-toggle-btn" onclick="toggleTimer()">▶</button>
                    <button class="timer-btn" onclick="resetTimer()">↺</button>
                </div>
            </div>

            <div class="search-container">
                <div class="search-wrapper">
                    <input type="text" id="search" name="eve-main-search" placeholder="Search or Type URL..."
                        autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
                        data-lpignore="true" data-1p-ignore="true" autofocus
                        onkeypress="handleOmniboxKey(event)">
                    <button class="search-icon-btn" onclick="performWebSearch()" title="Web Search (/)">🔍</button>
                    <button class="search-advanced-btn" onclick="openExpandedSearchFromMain(false)" title="Expanded Search">⚙</button>
                </div>
            </div>

            <div class="action-row">
                <button class="big-btn btn-add" onclick="openAddModal()" title="Add Link (N)">+ Add Link</button>
                <button class="big-btn btn-sec" onclick="sweepDone()">🧹 Sweep</button>
                <button class="big-btn btn-sec" onclick="openBulkModal()">📚 Bulk</button>
            </div>
        </div>

        <div id="focus-banner" class="focus-banner" onclick="clearFocus()"></div>

        <div id="dock-container" class="dock-container hidden"></div>

        <div class="container" id="dashboard-grid"></div>
    </div>

    <!-- MODALS & EMOJI PICKER LOADED DYNAMICALLY -->
    <!-- SCRATCHPAD LOADED DYNAMICALLY -->
    <!-- CONTEXT MENUS LOADED DYNAMICALLY -->


    <!-- Wiki Popup Overlay (Scraper Feature) -->
    <div class="popup-overlay" id="wikiPopup">
        <div class="popup-content">
            <div class="popup-header">
                <div class="popup-nav">
                    <button class="popup-nav-btn" id="popupBackBtn" onclick="PopupManager.navigatePopupBack()"
                        title="Go back" disabled>←</button>
                    <button class="popup-nav-btn" id="popupForwardBtn" onclick="PopupManager.navigatePopupForward()"
                        title="Go forward" disabled>→</button>
                </div>
                <h3 class="popup-title" id="wikiPopupTitle">Wiki Preview</h3>
                <button class="popup-close" onclick="PopupManager.closePopup()">×</button>
            </div>
            <div class="popup-iframe-container">
                <iframe id="wikiPopupFrame" class="popup-iframe" title="Web content viewer"
                    sandbox="allow-forms allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe>
            </div>
        </div>
    </div>

    <!-- Enhanced Loading Indicator (Search Monitor) -->
    <div id="loadingIndicator" class="loading-indicator compact visible">
        <button class="monitor-fullscreen-toggle" title="Toggle full screen" aria-label="Toggle full screen">⛶</button>
        <button class="monitor-wide-toggle" title="Toggle wide view" aria-label="Toggle wide view">⇔</button>
        <div class="dot"></div>
        <div class="indicator-content">
            <div class="indicator-title">Search Monitor</div>
            <div id="gemini-placeholder"></div>
            <div class="status-group" title="Toggle stats panel">
                <div class="status-text">Idle</div>
                <div class="wave-container">
                    <div class="wave"></div>
                </div>
                <span class="monitor-details-collapse-arrow">▼</span>
            </div>
            <div class="expanded-content">
                <div class="stats-row">
                    <span class="stats-label" id="searchStatusLabel">Status:</span>
                    <span class="stats-value" id="searchStatus">Idle</span>
                </div>
                <div class="stats-row">
                    <span class="stats-label" id="wikisSearchedLabel">Wikis Searched:</span>
                    <span class="stats-value" id="wikisSearched">0/0</span>
                </div>
                <div class="stats-row">
                    <span class="stats-label" id="resultsFoundLabel">Results Found:</span>
                    <span class="stats-value" id="resultsFound">0</span>
                </div>
            </div>
        </div>
    </div>
