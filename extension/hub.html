<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>EveOS Bridge Tools</title>
  <link rel="stylesheet" href="hub.css">
</head>
<body>
  <details class="setup-panel" data-collapse="setup">
    <summary>About & setup</summary>
    <header><span>BROWSER TOOLS</span><h1>EveOS Bridge</h1><p>Nexus, Dex, WatchFusion, and Tab URLs are included. Each tool also works standalone.</p></header>
    <nav>
      <button type="button" data-action="refresh">Refresh</button>
      <button type="button" class="primary" data-action="discover">Discover companions</button>
    </nav>
    <p class="privacy">Additional companion discovery is optional. Included tools use the same source as their standalone versions.</p>
  </details>
  <main>
    <details class="tool-section" data-collapse="section:services" open><summary><h2>Local services</h2></summary><div class="cards" data-services></div></details>
    <details class="tool-section" data-collapse="section:connectors" open><summary><h2>Browser tools</h2></summary><div class="cards" data-connectors></div></details>
  </main>
  <p role="status" data-status>Checking EveOS...</p>
  <script src="core/protocol.js"></script>
  <script src="core/ui-state.js"></script>
  <script src="hub.js"></script>
</body>
</html>
