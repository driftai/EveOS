name: One-shot controller port-registry cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/port-registry-controller-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply controller cleanup
        run: python .github/scripts/port_registry_controller_cleanup.py

      - name: Validate Python controllers
        run: >-
          python -m py_compile
          server_modules/eveos_web_control.py
          server_modules/eveos_control_helper.py
          server_modules/gemini_control.py
          server_modules/world_book_control.py
          server_modules/piano_player_control.py
          server_modules/watchfusion_control.py
          server_modules/eveos_ports.py

      - name: Run canonical port audit
        run: npm run audit:ports

      - name: Commit cleanup
        run: |
          git diff --check
          git config user.name "EveOS Port Cleanup"
          git config user.email "actions@users.noreply.github.com"
          git add server_modules/eveos_web_control.py server_modules/eveos_control_helper.py server_modules/gemini_control.py server_modules/world_book_control.py server_modules/piano_player_control.py tools/audit/eveos-port-registry-audit.js
          git commit -m "refactor(ports): remove managed controller literal fallbacks"
          git push origin HEAD:main

# Rerun marker after aligning the browser local-control audit with its registry helper.
