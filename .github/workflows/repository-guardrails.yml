name: Repository guardrails

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: repo-guardrails-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structural:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Confirm supported Node runtime
        shell: bash
        run: |
          node --version
          node -e "if (Number(process.versions.node.split('.')[0]) < 20) process.exit(1)"
      - name: Protect private/runtime boundaries
        run: node tools/audit/eveos_repo_hygiene_guard.mjs
      - name: Prove smoke registry is closed
        run: node tools/audit/smoke-registry-audit.js
      - name: Enforce generated runtime asset versions
        shell: bash
        run: |
          node tools/audit/sync-runtime-asset-versions.js --write
          git diff -- EveOS.html js/config/manifest/scripts.parts/03-feature-modules.js
          git diff --exit-code -- EveOS.html js/config/manifest/scripts.parts/03-feature-modules.js
      - name: Protect Queue View pointer stability
        run: node tests/audioflix_queue_view_stability.test.cjs

  fresh-install:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Provide supported Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Reconstruct EveOS from tracked dependencies
        run: node tools/setup/eveos_bootstrap.mjs --skip-browser
      - name: Run repository guardrails through the project virtualenv
        run: node tools/setup/eveos_npm.mjs run --silent test:guardrails
