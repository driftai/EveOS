<!doctype html>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; worker-src 'self'">
<title>Experiment E capture</title>
<body style="font:13px system-ui;background:#0d1117;color:#e6edf3;padding:12px">
<h3 style="margin:0 0 8px">Experiment E: targeted capture (not production)</h3>
<div id="cfg"></div>
<p>
  <button id="start">Start capture</button>
  <button id="stop">Stop capture</button>
  Gain: <button data-gain="1">100%</button><button data-gain="0.5">50%</button><button data-gain="0">0%</button>
</p>
<p>
  Source: <button data-src="reload">Reload</button><button data-src="destroy">Destroy</button><button data-src="recreate">Recreate</button>
  <button id="metrics">CPU/mem</button>
</p>
<pre id="out" style="background:#161b22;padding:8px;min-height:220px;white-space:pre-wrap"></pre>
<script src="capture.js"></script>
</body>
